  - Repo documentation (`README.md`, `USER_GUIDE.md`, `CLAUDE.md`) is no longer published into `_site` — added to Jekyll's `exclude:` list.

  ## Verified root cause

  - **About link** — `_config.yml`'s `header_pages` listed a stale `about.markdown` entry against an exact-path Liquid lookup (`site.pages | where: "path", path`); the actual file is `about.md`, so the lookup silently dropped the link. Already fixed at HEAD by commit `ff17186`; this cycle verified it rather than re-fixing it (the issue's original premise was partly stale by the time we checked — the link already worked).
  - **Mobile nav interaction defect** — found during review, not in the original diagnosis. The in-flow (push-down) panel committed in `a77ecf2` reflowed the page ~230px on open; a pointerdown-based outside-close then closed the panel before the browser resolved the tap's click target, so a dismiss-tap on non-interactive content re-hit-tested against the shifted layout and navigated to whatever link had slid under the finger. Measured 9/9 spurious navigations on the real built site in round 2. Fixed by taking the panel out of flow at ≤46rem — zero reflow removes the retarget class in both directions — rather than adding more guards around the reflow.
  - **Repo docs publication exposure** — `README.md`, `USER_GUIDE.md`, `CLAUDE.md` were reachable at the site root in every build (no credentials present, but not intended for publication). Pre-existing; found by this cycle's exposure audit. Fixed via `_config.yml` `exclude:`.

  ## Test plan

  - `bundle exec jekyll build` — exit 0, 24 HTML pages.
  - CI-exact: `JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,_config_production.yml --baseurl ""` — exit 0, 24 HTML pages.
  - Sensitive-file absence: `find _site \( -iname 'README*' -o -iname 'USER_GUIDE*' -o -iname 'CLAUDE*' \)` — 0 hits in both builds.
  - Real-site interaction (round 3, run against the real built `_site/`, real Chrome via Playwright): 0px reflow on open/close across 9 pages (was 230px pre-fix); 0/9 spurious retargets and 0/9 failed closes (was 9/9 retargets pre-fix on the reconstructed round-2 artifact); a 51-tap dense stratified sweep found zero reflow-retargets; 14/14 regression paths pass, including an iOS-simulation path with the compat click suppressed.
  - Rendered-output regression (V8, recorded in the run snapshot): `about.md`, `articles.md`, `tools.md` (the files `ff17186` touched) each assert real rendered content, including confirming `tools.md`'s documented kramdown-comment hazard stays latent rather than triggering.
  - Published-file-set regression (V7, recorded in the run snapshot): `README.md`/`USER_GUIDE.md`/`CLAUDE.md` absent from `_site` in both the base and CI-exact builds; a mutation control confirms the exclude edit is load-bearing (reverting it republishes all three); the durable oracle is a 26-file inventory count (`find _site -type f ! -path '*/assets/*' ! -path '*/fonts/*'`), not an extension-scoped denylist (a wrong-extension file would defeat a denylist alone).

  ## Risk notes

  - Presentation-only change. No content or information-architecture change — the nav's IA (landing homepage + 5-item top nav) is unchanged and covered separately by ADR-0005.
  - **Design change disclosed**: the mobile panel moves from an in-flow push-down (the committed `a77ecf2` variant) to an out-of-flow overlay card at ≤46rem. This is the reviewer-prescribed remedy for the reflow-retarget defect above, not a scope change.
  - Both interaction-test rounds ran against Chrome emulation only (via Playwright); a true iOS WebKit device check is recommended before this merges.
  - Changes are currently uncommitted on top of HEAD `43ab7f2` (five files: `_config.yml`, `_layouts/default.html`, `assets/main.scss`, `tools.md`, root `CLAUDE.md`) — left for the human to review and commit.

