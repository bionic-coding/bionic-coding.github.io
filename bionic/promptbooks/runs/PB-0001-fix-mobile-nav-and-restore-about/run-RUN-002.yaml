  ## Diagnosis (Prompt 1 — verify module, RUN-001; revised per council rounds 1–2 in RUN-002)

  Issue: broken header navigation on the Bionic Coding Jekyll site — three symptoms, all reproduced by two independent read-only agents + a clean `bundle exec jekyll build`.

  ### Symptom 1 — About link missing from nav (VERIFIED FIXED; verify-only)
  - Evidence: `_config.yml` header_pages (line 71) now lists `about.md`. The nav loop in `_layouts/default.html` (30-33) resolves each header page via `site.pages | where: "path", path | first` (exact-path match). A stale `about.markdown` entry matched no page (file is `about.md`), emitting no <a>. A clean jekyll build confirms the corrected config renders the `/about/` link in the compiled nav on all 24 HTML pages as of the 2026-08-14 clean build (home + lesson pages); 5 nav links present (Manifesto, Articles, Learn, Tools, About); site title links home separately.
  - Root cause: stale exact path string in config (`about.markdown`) vs actual filename (`about.md`) against an exact-path Liquid lookup. Cause = config path mismatch; symptom = missing link.
  - Scope: `_config.yml` only. The fix is committed at HEAD (ff17186) — verify-only; do NOT re-apply.
  - Remediation: none — verify-only. Do NOT re-apply or rename `about.md`.

  ### Symptom 2 — Hamburger tap target below 44px floor (VERIFIED FIXED; verify-only)
  - Evidence (historical, pre-fix, 2026-07-18): `.nav-toggle` (then at assets/main.scss 182-192) = `padding: 0.3rem` around a 22x22 SVG (default.html 25). Box ~= 22 + 2*(0.3*16) = 31.6px square — below the 44px touch floor. Button read as dead.
  - At HEAD (commit a77ecf2): `.nav-toggle` (assets/main.scss 183-196) carries `min-width:44px; min-height:44px; justify-content:center` (with `line-height:0` and token color kept) — tap target meets the 44px floor.
  - Root cause: insufficient min tap dimensions on `.nav-toggle`.
  - Scope: assets/main.scss (`.nav-toggle`).
  - Remediation: none — already implemented in a77ecf2; verify-only. Do NOT re-apply.

  ### Symptom 3 — Open mobile menu looks broken (VERIFIED FIXED; verify-only)
  - Evidence (historical, pre-fix, 2026-07-18): in `@media (max-width:46rem)` (then at assets/main.scss 662-685): `.site-nav.is-open` only set display:flex — no surface bg; links inherited `.site-nav a { color: var(--muted) }` — muted color, a secondary factor (the primary legibility defect was the missing surface); each link had `border-top:1px solid var(--rule)` stacked cramped hairlines; `padding:0.6rem 0` at ~0.82rem font => row ~43px (<44px).
  - At HEAD (commit a77ecf2): the 46rem block (assets/main.scss 668-703) implements the book-goal FALLBACK inset-panel variant: `.site-nav` carries `background:var(--surface)`, `border:1px solid var(--rule)`, `border-radius:6px` (inset within `.wrap` padding — never overflows); `.site-nav a` carries `color:var(--ink)`, `min-height:44px`, flex-centered rows; per-link hairlines replaced by row-divider-only `.site-nav a + a { border-top:1px solid var(--rule) }` (no first-row hairline, so no double hairline against the header border).
  - Root cause: collapsed panel never styled as a legible surface; reuses desktop muted inline-link styling.
  - Scope: assets/main.scss (the 46rem media block).
  - Remediation: none — already implemented in a77ecf2 as the book-goal FALLBACK inset-panel variant; verify-only. Do NOT re-apply and do NOT replace with the full-bleed primary variant.

  ### Toggle hardening (markup + JS; _layouts/default.html) (VERIFIED FIXED; verify-only)
  - Evidence (historical, pre-fix, 2026-07-18): `.nav-toggle` button (line 24) had no `type` (defaulted to submit); JS (then 49-67) toggled + closed on link-tap but had NO Escape-close and NO outside-click-close.
  - At HEAD (commit a77ecf2): button carries `type="button"` (_layouts/default.html 24); JS (49-73) has `setOpen()` with aria-expanded sync, close-on-link-tap, Escape keydown close, and outside-click close (`.header-inner` containment check).
  - Remediation: none — already implemented in a77ecf2; verify-only. Do NOT re-apply. No new deps; breakpoint 46rem unchanged.

  ### Overall
  - Architectural? No — config typo correction + CSS/markup refinement inside the already-decided custom presentation layer (ADR-0003). No new decision. Iterate cycle correct; no escape to dev-cycle.
  - Files in scope (ALL verify-only): `_config.yml` (fix committed ff17186), `assets/main.scss` (fixes committed a77ecf2), `_layouts/default.html` (fixes committed a77ecf2).
  - Cycle posture: every remediation is already committed at HEAD (S1 in ff17186; S2/S3/toggle-hardening in a77ecf2 — landed during RUN-001 before its abandonment). This is now a verify-only iterate cycle: confirm the committed implementation meets every diagnosed requirement (build + rendered-output checks), then document. Nothing remains to implement.
  - Out of scope: pre-existing ADR-0004 header_pages drift (config-path vs filename consistency across header pages) — tracked separately, not in this cycle (corrected in Prompt 11: the drift was ADR-0004's stale DECISION, not merely the path string — the Accepted ADR contradicted HEAD's landing-page homepage + 5-item nav; see the Fix loop section below).
  - Verification method (CSS/content site — no test suite/linter/static-analysis; code gates unittest/verify-code-docs/extract-code-docs are N/A): run `bundle exec jekyll clean` FIRST (stale `.jekyll-cache` re-renders the old 4-link/no-About state and false-negatives the S1 check), then `bundle exec jekyll build` clean, then read `_site/**/index.html` nav markup (5 links incl `/about/` on home + a lesson page) and `_site/assets/main.css` (`.nav-toggle` 44px rules + `@media (max-width:46rem)` surface panel); reason about box model (no horizontal scrollbar at 375/390/414; no double hairline). Also validate against the GitHub Actions production build per ADR-0003 (`jekyll build` with the production overlay, Dart-Sass compiler): the change uses only existing design tokens and plain CSS properties — no new Sass-function usage, no new build risk.

