  ## Verification plan (Prompt 5 — dev module, RUN-002)

  ### Posture

  Zero code-edit units. All four remediations are committed ancestors of HEAD `43ab7f2` — `ff17186` (S1, `_config.yml`) and `a77ecf2` (S2/S3/toggle, `_layouts/default.html` + `assets/main.scss`), both confirmed by `git merge-base --is-ancestor`. The dev module's work is six independently checkable verification units (V1–V6) that prove the committed implementation satisfies every diagnosed requirement. Nothing is re-implemented; the committed Symptom-3 implementation is the book-goal FALLBACK inset-panel variant and stays.

  Precondition (run once, before V1). Confirm the working tree carries no uncommitted site-file change, so build output is attributable to HEAD: `git status --short -- ':!bionic/'` — expect EMPTY output (only `bionic/` docs files are modified). If non-empty, STOP — build evidence would describe the working tree, not HEAD.

  ### V1 — Nav links render on every page

  Claim: a clean build emits 24 HTML pages; every page carries a 5-link nav (Manifesto, Articles, Lessons, Tools, About) including `/about/`.

  Commands: `bundle exec jekyll clean && bundle exec jekyll build`; `find _site -name "*.html" | wc -l`; `grep -L 'href="/about/"' $(find _site -name "*.html") | wc -l`; extract the `<nav class="site-nav" id="site-nav">…</nav>` block from `_site/index.html` and one lesson page; per-page link-count histogram over all 24 pages.

  Expected tokens: build exit 0; HTML page count 24; pages missing `/about/` = 0; nav block byte-exact: `<nav class="site-nav" id="site-nav"><a href="/manifesto/">Manifesto</a><a href="/articles/">Articles</a><a href="/learn/">Lessons</a><a href="/tools/">Tools</a><a href="/about/">About</a></nav>`; histogram exactly `24 5` (no NONAV, no other count).

  Page inventory (so 24 is auditable): 6 posts + `404.html` + 5 top-level pages (index, manifesto, articles, tools, about) + `/learn/` index + 11 lesson pages = 24. `404.html` renders the nav and is included in the "every page" claim.

  ### V2 — Hamburger tap target meets the 44px floor

  Claim: compiled CSS carries `min-width: 44px` / `min-height: 44px` on `.nav-toggle`; box-model math confirms ≥44×44 CSS px.

  Commands: `grep -A14 '^\.nav-toggle {' _site/assets/main.css`; `grep -c 'box-sizing: border-box' _site/assets/main.css`.

  Expected tokens: inside `.nav-toggle` — `display: none;`, `align-items: center;`, `justify-content: center;`, `min-width: 44px;`, `min-height: 44px;`, `padding: 0.3rem;`, `border: 0;`, `line-height: 0;`; universal border-box count ≥1.

  Box-model reasoning to record: `box-sizing: border-box` applies to `*` (source assets/main.scss 71–75) and `border: 0`, so the `min-*` pair floors the border-box at 44×44. Natural size = 22px SVG + 2×0.3rem (9.6px) = 31.6px — the pre-fix figure — so the mins are load-bearing. At ≤46rem the button is `display: inline-flex` with the glyph centered in the 44px box.

  ### V3 — Collapsed menu renders as an inset surface panel

  Claim: compiled CSS carries the 46rem inset-panel rules with row dividers only between rows.

